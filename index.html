<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi bà...</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <img src="anh2.png" class="funny-meme meme-1" alt="Thỏ hồng">
    <img src="anh1.png" class="funny-meme meme-2" alt="3 khuôn mặt">
    <img src="anh3.png" class="funny-meme meme-3" alt="con chó">
    <img src="anh4.png" class="funny-meme meme-4" alt="con khỉ">
    <img src="anh5.png" class="funny-meme meme-5" alt="sin">
    <div class="container">
        <h1></h1>
        
        <div class="button-group">
            <div class="mail-btn" id="openMail">💌 Mở hộp thư</div>
            <a href="flower.html" class="gift-btn">Mở quà 🎁</a>
        </div>
    </div>

    <div id="letterModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeMail">&times;</span>
            <h2>Gửi Em 💌,</h2>
            <p>Chúc người Đẹp ngày 1/6 vui vẻ tuyệt vời, tràn đầy năng lượng cùng ngập tràn điều hạnh phúc</p>
            <p>Luôn vui vẻ, tươi tắn và xinh xắn, bỏ lại hết những muộn phiền và nở nụ cười thật xinh nhoaaa hihi</p>
            <p>❤️❤️❤️❤️</p>
        </div>
    </div>

    <script>
        // Hiệu ứng hạt lấp lánh cũ của ông
        function createParticles() {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 3 + 1 + 'px';
                particle.style.width = size;
                particle.style.height = size;
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                document.body.appendChild(particle);
            }
        }
        createParticles();

        // ------------------------------------------------
        // CODE JAVASCRIPT MỚI CHO HỘP THƯ
        // ------------------------------------------------
        const mailBtn = document.getElementById('openMail');
        const modal = document.getElementById('letterModal');
        const closeBtn = document.getElementById('closeMail');

        // Mở thư
        mailBtn.onclick = function() {
            modal.style.display = "flex";
            // Dùng setTimeout để hiệu ứng CSS transition hoạt động mượt
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        // Đóng thư khi bấm dấu X
        closeBtn.onclick = function() {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = "none";
            }, 400); // Đợi 400ms cho hiệu ứng mờ dần xong mới ẩn hẳn
        }

        // Đóng thư khi click ra ngoài vùng bức thư
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = "none";
                }, 400);
            }
        }
    </script>
</body>
</html>
